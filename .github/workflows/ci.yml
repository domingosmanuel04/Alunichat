name: ci

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  smoke-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile || pnpm install
      - run: pnpm --filter @alurichat/shared build
      - run: pnpm --filter @alurichat/database exec prisma generate || true
      - run: pnpm --filter @alurichat/api exec tsc -p tsconfig.build.json --noEmit

  e2e-web:
    runs-on: ubuntu-latest
    needs: smoke-api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile || pnpm install
      - run: pnpm --filter @alurichat/web exec playwright install --with-deps chromium || npx playwright install --with-deps chromium
      - name: Skip live e2e without services
        run: echo "Playwright suite present at apps/web/e2e — run against local API/web in CD"
