services:
  mysql:
    image: mysql:8.4
    container_name: alurichat-mysql
    restart: unless-stopped
    ports:
      - "3311:3306"
    environment:
      MYSQL_USER: alurichat
      MYSQL_PASSWORD: alurichat
      MYSQL_DATABASE: alurichat
      MYSQL_ROOT_PASSWORD: alurichat
    volumes:
      - alurichat_mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ualurichat", "-palurichat"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: alurichat-redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - alurichat_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  alurichat_mysql_data:
  alurichat_redis_data:
