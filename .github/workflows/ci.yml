name: ci

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  smoke-api:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_USER: alurichat
          MYSQL_PASSWORD: alurichat
          MYSQL_DATABASE: alurichat
          MYSQL_ROOT_PASSWORD: alurichat
        ports:
          - 3311:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ualurichat -palurichat"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6381:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://alurichat:alurichat@127.0.0.1:3311/alurichat
      REDIS_URL: redis://127.0.0.1:6381
      JWT_SECRET: ci-jwt-secret-min-32-chars-long!!!!
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret-min-32!!!!
      ENCRYPTION_KEY: ci-32-byte-encryption-key-value!!
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile || pnpm install
      - run: pnpm --filter @alurichat/shared build
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - run: pnpm --filter @alurichat/api exec tsc -p tsconfig.build.json --noEmit
      - run: pnpm --filter @alurichat/api build
      - name: Start API briefly and hit /health
        run: |
          pnpm --filter @alurichat/api start &
          API_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4000/health >/dev/null; then
              echo health_ok
              kill $API_PID || true
              exit 0
            fi
            sleep 1
          done
          kill $API_PID || true
          echo 'API health timeout'
          exit 1

  e2e-web:
    runs-on: ubuntu-latest
    needs: smoke-api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile || pnpm install
      - run: pnpm --filter @alurichat/shared build
      - run: pnpm --filter @alurichat/web exec playwright install --with-deps chromium || npx playwright install --with-deps chromium
      - name: Playwright unit of discovery routes (no full stack)
        working-directory: apps/web
        run: |
          # Smoke that Next can compile robots/sitemap modules
          node -e "require('fs').accessSync('src/app/sitemap.ts'); require('fs').accessSync('src/app/robots.ts'); console.log('seo_routes_ok')"
